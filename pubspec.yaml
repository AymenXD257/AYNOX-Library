name: aynox_library
description: "AYNOX Library - Multilingual Digital Library and E-Reader Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State Management & Utilities
  provider: ^6.1.2
  shared_preferences: ^2.3.5
  connectivity_plus: ^6.1.1

  # Networking & File Handling
  http: ^1.3.0
  path_provider: ^2.1.5
  file_picker: ^8.1.7

  # EPUB & Document Processing (Pure Dart)
  archive: ^4.0.2
  xml: ^6.5.0

  # PDF Rendering
  flutter_pdfview: ^1.3.4

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/sample/
